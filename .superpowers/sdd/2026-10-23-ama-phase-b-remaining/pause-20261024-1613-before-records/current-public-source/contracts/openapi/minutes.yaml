  "MinutesInitialCommand": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "templateRevisionId"
    ],
    "properties": {
      "expectedRevisionToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Lossless decimal; preserve every digit. Revision values stop at 9223372036854775806."
      },
      "expectedRevision": {
        "type": "integer",
        "minimum": 0,
        "maximum": 9223372036854775806,
        "description": "Legacy exact integer; unsafe IEEE-754 values require expectedRevisionToken. If both are present they must be equal."
      },
      "templateRevisionId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      }
    },
    "anyOf": [
      {
        "required": [
          "expectedRevisionToken"
        ]
      },
      {
        "required": [
          "expectedRevision"
        ]
      }
    ],
    "description": "Exact object. Duplicate/unknown fields, trailing data, fractions and unequal dual revision representations are rejected. Body transport limit is 1 MiB."
  },
