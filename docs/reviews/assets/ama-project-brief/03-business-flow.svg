<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1130" viewBox="0 0 2000 1130">
<rect width="2000" height="1130" fill="#F7F9FC"/>
<rect x="80" y="55" width="88" height="62" rx="14" fill="#14243D" stroke="#14243D" stroke-width="2"/>
<text x="124" y="98.7" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="white">03</text>
<text x="192" y="101.1" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="49" font-weight="700" text-anchor="start" fill="#14243D">会议成果生成与发布流程</text>
<text x="80" y="167.3" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="400" text-anchor="start" fill="#63758B">统一处理链路，两个确认节点，保留人工判断与来源依据</text>
<rect x="80" y="215" width="1840" height="108" rx="22" fill="#14243D" stroke="#14243D" stroke-width="2"/>
<text x="1000" y="281.6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" text-anchor="middle" fill="white">输入：文件导入或在线录音  +  可选背景材料</text>
<polyline points="350,323 350,415" fill="none" stroke="#2563EB" stroke-width="5" stroke-linejoin="round"/>
<polygon points="350.0,415.0 359.0,398.0 341.0,398.0" fill="#2563EB"/>
<rect x="80" y="415" width="540" height="225" rx="22" fill="#EDF4FF" stroke="#D7E1EE" stroke-width="2"/>
<rect x="106" y="445" width="7" height="42" rx="3" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="131" y="477.6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" text-anchor="start" fill="#14243D">01  输入准备</text>
<text x="111" y="547.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">保存主文件与材料</text>
<text x="111" y="600.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">固定本次处理输入</text>
<rect x="730" y="415" width="540" height="225" rx="22" fill="#EDF4FF" stroke="#D7E1EE" stroke-width="2"/>
<rect x="756" y="445" width="7" height="42" rx="3" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="781" y="477.6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" text-anchor="start" fill="#14243D">02  转写与增强</text>
<text x="761" y="547.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">内容解析与模型处理</text>
<text x="761" y="600.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">形成待核对转写</text>
<rect x="1380" y="415" width="540" height="225" rx="22" fill="#FFF4DF" stroke="#D7E1EE" stroke-width="2"/>
<rect x="1406" y="445" width="7" height="42" rx="3" fill="#D97706" stroke="#D97706" stroke-width="2"/>
<text x="1431" y="477.6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" text-anchor="start" fill="#14243D">03  人工确认转写</text>
<text x="1411" y="547.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">修订文字与说话人</text>
<text x="1411" y="600.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">确认可用于生成的版本</text>
<rect x="1380" y="770" width="540" height="225" rx="22" fill="#E9F7F3" stroke="#D7E1EE" stroke-width="2"/>
<rect x="1406" y="800" width="7" height="42" rx="3" fill="#0D9488" stroke="#0D9488" stroke-width="2"/>
<text x="1431" y="832.6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" text-anchor="start" fill="#14243D">04  生成与编辑纪要</text>
<text x="1411" y="902.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">提炼七类会议要素</text>
<text x="1411" y="955.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">核对来源并编辑正文</text>
<rect x="730" y="770" width="540" height="225" rx="22" fill="#FFF4DF" stroke="#D7E1EE" stroke-width="2"/>
<rect x="756" y="800" width="7" height="42" rx="3" fill="#D97706" stroke="#D97706" stroke-width="2"/>
<text x="781" y="832.6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" text-anchor="start" fill="#14243D">05  最终确认</text>
<text x="761" y="902.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">校验信息、成果与权限</text>
<text x="761" y="955.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">冻结本次发布版本</text>
<rect x="80" y="770" width="540" height="225" rx="22" fill="#E9F7F3" stroke="#D7E1EE" stroke-width="2"/>
<rect x="106" y="800" width="7" height="42" rx="3" fill="#0D9488" stroke="#0D9488" stroke-width="2"/>
<text x="131" y="832.6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" text-anchor="start" fill="#14243D">06  发布与回看</text>
<text x="111" y="902.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">发布知识库并核验状态</text>
<text x="111" y="955.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#31445D">按权限回看、检索与导出</text>
<polyline points="620,525 730,525" fill="none" stroke="#2563EB" stroke-width="5" stroke-linejoin="round"/>
<polygon points="730.0,525.0 713.0,516.0 713.0,534.0" fill="#2563EB"/>
<polyline points="1270,525 1380,525" fill="none" stroke="#2563EB" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1380.0,525.0 1363.0,516.0 1363.0,534.0" fill="#2563EB"/>
<polyline points="1650,640 1650,770" fill="none" stroke="#2563EB" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1650.0,770.0 1659.0,753.0 1641.0,753.0" fill="#2563EB"/>
<polyline points="1380,880 1270,880" fill="none" stroke="#2563EB" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1270.0,880.0 1287.0,889.0 1287.0,871.0" fill="#2563EB"/>
<polyline points="730,880 620,880" fill="none" stroke="#2563EB" stroke-width="5" stroke-linejoin="round"/>
<polygon points="620.0,880.0 637.0,889.0 637.0,871.0" fill="#2563EB"/>
<text x="80" y="1087.3" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="400" text-anchor="start" fill="#63758B">异常处理：保留草稿与历史；失败可重试；发布结果未知时先查回状态。</text>
</svg>