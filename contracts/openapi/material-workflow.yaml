{
  "recordingCancel": {
    "servers": [
      {
        "url": "http://127.0.0.1:8080"
      }
    ],
    "parameters": [
      {
        "name": "sessionId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "recordingCancel",
      "security": [
        {
          "enterpriseSession": []
        }
      ],
      "responses": {
        "200": {
          "description": "Observed outcome",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./recording.yaml#/RecordingProcessing"
              }
            }
          }
        }
      },
      "parameters": [
        {
          "$ref": "./identity.yaml#/Origin"
        },
        {
          "$ref": "./identity.yaml#/Csrf"
        },
        {
          "in": "header",
          "name": "Idempotency-Key",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "required": [
                "runId",
                "expectedRevisionToken"
              ],
              "additionalProperties": false,
              "properties": {
                "runId": {
                  "type": "string",
                  "format": "uuid"
                },
                "expectedRevisionToken": {
                  "type": "string",
                  "pattern": "^(0|[1-9][0-9]{0,18})$"
                }
              }
            }
          }
        }
      }
    }
  },
