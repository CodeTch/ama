  "readLatestMaterialAdjustment": {
    "servers": [
      {
        "url": "http://127.0.0.1:8080"
      }
    ],
    "parameters": [
      {
        "name": "meeting",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "get": {
      "operationId": "readLatestMaterialAdjustment",
      "security": [
        {
          "enterpriseSession": []
        }
      ],
      "responses": {
        "200": {
          "description": "Observed outcome",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "stage"
                ],
                "properties": {
                  "stage": {
                    "type": "string",
                    "enum": [
                      "NONE",
                      "PENDING",
                      "SUBMITTED",
                      "READY",
                      "STALE",
                      "FAILED"
                    ]
                  },
                  "id": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "candidateId": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "format": "uuid"
                  },
                  "errorCode": {
                    "type": [
                      "string",
                      "null"
                    ]
                  }
                },
                "additionalProperties": false
              }
            }
          }
        }
      }
    }
  },
