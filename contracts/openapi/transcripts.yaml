{
  "Observation": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "meetingRevision",
      "revisionToken",
      "accessRevision",
      "accessRevisionToken",
      "currentSavedRevisionId",
      "currentConfirmationId"
    ],
    "properties": {
      "meetingRevision": {
        "type": "integer",
        "format": "int64",
        "minimum": 0
      },
      "revisionToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Opaque decimal token. Preserve every digit; supported business revisions are 0..9223372036854775806."
      },
      "accessRevision": {
        "type": "integer",
        "format": "int64",
        "minimum": 0
      },
      "accessRevisionToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Opaque decimal token. Preserve every digit; supported business revisions are 0..9223372036854775806."
      },
      "currentSavedRevisionId": {
        "oneOf": [
          {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          },
          {
            "type": "null"
          }
        ]
      },
      "currentConfirmationId": {
        "oneOf": [
          {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          },
          {
            "type": "null"
          }
        ]
      }
    }
  },
  "Correction": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "mode",
      "readiness",
      "qualificationId"
    ],
    "properties": {
      "mode": {
        "type": "string",
        "enum": [
          "DISABLED_NOT_INSTALLED",
          "UNAVAILABLE"
        ]
      },
      "readiness": {
        "type": "string",
        "enum": [
          "NOT_APPLICABLE",
          "UNAVAILABLE"
        ]
      },
      "qualificationId": {
        "oneOf": [
          {
            "type": "string"
          },
          {
            "type": "null"
          }
        ]
      }
    },
    "description": "Actual boot installation declaration and provider inventory. No pendingCount; NOT_APPLICABLE does not mean an installed reader counted zero."
  },
  "SourceEligibility": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "fileId",
      "eligibility",
      "reason"
    ],
    "properties": {
      "fileId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "eligibility": {
        "type": "string",
        "enum": [
          "ELIGIBLE",
          "INELIGIBLE",
          "UNAVAILABLE"
        ]
      },
      "reason": {
        "type": "string",
        "enum": [
          "AVAILABLE",
          "SOURCE_EPOCH_CHANGED",
          "FILE_UNAVAILABLE",
          "ROUTE_UNAVAILABLE"
        ]
      }
    }
  },
  "Source": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "fileId",
      "sha256",
      "sizeBytes",
      "sizeBytesToken",
      "ordinal"
    ],
    "properties": {
      "fileId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "sha256": {
        "type": "string",
        "pattern": "^[0-9a-f]{64}$"
      },
      "sizeBytes": {
        "type": "integer",
        "format": "int64",
        "minimum": 0
      },
      "sizeBytesToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Opaque decimal token. Preserve every digit; supported business revisions are 0..9223372036854775806."
      },
      "ordinal": {
        "type": "integer",
        "format": "int64",
        "minimum": 1
      }
    }
  },
  "Segment": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "segmentId",
      "ordinal",
      "body",
      "sourceFileId",
      "sourceParagraph",
      "startMs",
      "endMs",
      "speakerId",
      "marks"
    ],
    "properties": {
      "segmentId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "ordinal": {
        "type": "integer",
        "format": "int64",
        "minimum": 1
      },
      "body": {
        "type": "string"
      },
      "sourceFileId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "sourceParagraph": {
        "oneOf": [
          {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          {
            "type": "null"
          }
        ]
      },
      "startMs": {
        "oneOf": [
          {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          {
            "type": "null"
          }
        ]
      },
      "endMs": {
        "oneOf": [
          {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          {
            "type": "null"
          }
        ]
      },
      "speakerId": {
        "oneOf": [
          {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          },
          {
            "type": "null"
          }
        ]
      },
      "marks": {
        "type": "array",
        "items": {
          "type": "string",
          "enum": [
            "KEY",
            "CONCLUSION",
            "DISPUTE",
            "GENERATION_FOCUS"
          ]
        },
        "maxItems": 4,
        "uniqueItems": true
      }
    }
  },
  "MemberSaved": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "id",
      "kind",
      "revision",
      "revisionToken",
      "segments"
    ],
    "properties": {
      "id": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "kind": {
        "type": "string",
        "enum": [
          "RAW",
          "WORKING"
        ]
      },
      "revision": {
        "type": "integer",
        "format": "int64",
        "minimum": 0
      },
      "revisionToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Opaque decimal token. Preserve every digit; supported business revisions are 0..9223372036854775806."
      },
      "segments": {
        "type": "array",
        "items": {
          "$ref": "#/Segment"
        },
        "minItems": 1
      }
    },
    "description": "Effective current WORKING only for a confirmed member. Omits owner chain, task, batch, processing input and creator metadata."
  },
  "OwnerSaved": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "id",
      "kind",
      "revision",
      "revisionToken",
      "segments",
      "parentId",
      "batchId",
      "processingInputId",
      "inputFingerprint",
      "createdBy",
      "createdAt",
      "producerTaskId"
    ],
    "properties": {
      "id": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "kind": {
        "type": "string",
        "enum": [
          "RAW",
          "WORKING"
        ]
      },
      "revision": {
        "type": "integer",
        "format": "int64",
        "minimum": 0
      },
      "revisionToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Opaque decimal token. Preserve every digit; supported business revisions are 0..9223372036854775806."
      },
      "segments": {
        "type": "array",
        "items": {
          "$ref": "#/Segment"
        },
        "minItems": 1
      },
      "parentId": {
        "oneOf": [
          {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          },
          {
            "type": "null"
          }
        ]
      },
      "batchId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "processingInputId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "inputFingerprint": {
        "type": "string",
        "pattern": "^[0-9a-f]{64}$"
      },
      "createdBy": {
        "type": "string"
      },
      "createdAt": {
        "type": "string",
        "format": "date-time"
      },
      "producerTaskId": {
        "oneOf": [
          {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          },
          {
            "type": "null"
          }
        ]
      }
    }
  },
  "Confirmation": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "id",
      "revisionId",
      "contentHash",
      "confirmedBy",
      "confirmedAt",
      "profile",
      "isCurrent"
    ],
    "properties": {
      "id": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "revisionId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "contentHash": {
        "type": "string",
        "pattern": "^[0-9a-f]{64}$"
      },
      "confirmedBy": {
        "type": "string"
      },
      "confirmedAt": {
        "type": "string",
        "format": "date-time"
      },
      "profile": {
        "type": "string",
        "enum": [
          "ama.transcript-confirmation.v1"
        ]
      },
      "isCurrent": {
        "type": "boolean"
      }
    }
  },
  "Capabilities": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "canReadHistory",
      "canSave",
      "canRestore",
      "canReadSources",
      "canConfirm"
    ],
    "properties": {
      "canReadHistory": {
        "type": "boolean"
      },
      "canSave": {
        "type": "boolean"
      },
      "canRestore": {
        "type": "boolean"
      },
      "canReadSources": {
        "type": "boolean"
      },
      "canConfirm": {
        "type": "boolean"
      }
    },
    "description": "Fresh observations only, never transferable mutation or source grants. Later installed candidate/publication policies may further deny writes."
  },
  "Current": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "meetingId",
      "observation",
      "storedInspection",
      "sourceBytes",
      "correction",
      "capabilities",
      "needsGeneration",
      "confirmation",
      "sources",
      "saved"
    ],
    "properties": {
      "meetingId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "observation": {
        "$ref": "#/Observation"
      },
      "storedInspection": {
        "type": "string",
        "const": "AVAILABLE"
      },
      "sourceBytes": {
        "type": "array",
        "items": {
          "$ref": "#/SourceEligibility"
        }
      },
      "correction": {
        "$ref": "#/Correction"
      },
      "capabilities": {
        "$ref": "#/Capabilities"
      },
      "needsGeneration": {
        "type": "boolean"
      },
      "confirmation": {
        "oneOf": [
          {
            "$ref": "#/Confirmation"
          },
          {
            "type": "null"
          }
        ]
      },
      "sources": {
        "type": "array",
        "items": {
          "$ref": "#/Source"
        }
      },
      "parserVersion": {
        "type": "string"
      },
      "processingConfigVersion": {
        "type": "string"
      },
      "confirmationHashProfile": {
        "type": "string",
        "const": "ama.transcript-confirmation.v1"
      },
      "selectedConfirmation": {
        "oneOf": [
          {
            "$ref": "#/Confirmation"
          },
          {
            "type": "null"
          }
        ]
      },
      "saved": {
        "oneOf": [
          {
            "oneOf": [
              {
                "$ref": "#/OwnerSaved"
              },
              {
                "$ref": "#/MemberSaved"
              }
            ]
          },
          {
            "type": "null"
          }
        ]
      }
    },
    "description": "Actual current saved WORKING or saved:null; never substitutes RAW. Original complete internal graph remains required, while member output omits owner-only metadata. selectedConfirmation appears only for the owner."
  },
  "OwnerDetail": {
    "type": "object",
