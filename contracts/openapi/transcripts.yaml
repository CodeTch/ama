      }
    }
  },
  "History": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "items",
      "hasMore",
      "nextCursor",
      "observation"
    ],
    "properties": {
      "items": {
        "type": "array",
        "items": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "id",
            "kind",
            "revision",
            "revisionToken",
            "createdBy",
            "createdAt"
          ],
          "properties": {
            "id": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            },
            "kind": {
              "type": "string",
              "enum": [
                "RAW",
                "WORKING"
              ]
            },
            "revision": {
              "type": "integer",
              "format": "int64",
              "minimum": 0
            },
            "revisionToken": {
              "type": "string",
              "pattern": "^(0|[1-9][0-9]{0,18})$",
              "description": "Opaque decimal token. Preserve every digit; supported business revisions are 0..9223372036854775806."
            },
            "createdBy": {
              "type": "string"
            },
            "createdAt": {
              "type": "string",
              "format": "date-time"
            }
          }
        },
        "maxItems": 50
      },
      "hasMore": {
        "type": "boolean"
      },
      "nextCursor": {
        "oneOf": [
          {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]{0,18})$",
            "description": "Opaque decimal token. Preserve every digit; supported business revisions are 0..9223372036854775806."
          },
          {
            "type": "null"
          }
        ]
      },
      "observation": {
        "$ref": "#/Observation"
      }
    }
  },
  "SaveRequest": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "sourceRevisionId",
      "segments"
    ],
    "properties": {
      "expectedRevision": {
        "$ref": "./meetings.yaml#/ExpectedRevision"
      },
      "expectedRevisionToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Opaque decimal token. Preserve every digit; supported business revisions are 0..9223372036854775806."
      },
      "sourceRevisionId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "segments": {
        "type": "array",
        "items": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "segmentId",
            "body",
            "marks"
          ],
          "properties": {
            "segmentId": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            },
            "body": {
              "type": "string"
            },
            "marks": {
              "type": "array",
              "items": {
                "type": "string",
                "enum": [
                  "KEY",
                  "CONCLUSION",
                  "DISPUTE",
                  "GENERATION_FOCUS"
                ]
              },
              "maxItems": 4,
              "uniqueItems": true
            }
          }
        },
        "minItems": 1,
        "maxItems": 100000
      }
    },
    "description": "At least one exact expected revision representation; equal dual values normalize identically. Complete ordered segment set; immutable source IDs/order/metadata. Strict duplicate/unknown/trailing/scalar JSON, 8388608-byte streaming envelope, no trim/NFC. Current operational admission applies after accepted-result lookup.",
    "allOf": [
      {
        "anyOf": [
          {
            "type": "object",
            "required": [
              "expectedRevision"
            ],
            "properties": {
              "expectedRevision": {
                "$ref": "./meetings.yaml#/ExpectedRevision"
              }
            }
          },
          {
            "type": "object",
            "required": [
              "expectedRevisionToken"
            ],
            "properties": {
