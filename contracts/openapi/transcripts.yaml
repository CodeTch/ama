    "description": "Exact owner RAW/WORKING retained text and all marks. Byte-only epoch/route failures are separately reported; missing/corrupt original provenance or archives fail closed."
  },
  "Marks": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "revisionId",
      "complete",
      "segments",
      "observation",
      "sourceBytes",
      "storedInspection"
    ],
    "properties": {
      "revisionId": {
        "oneOf": [
          {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          },
          {
            "type": "null"
          }
        ]
      },
      "complete": {
        "type": "boolean",
        "const": true
      },
      "segments": {
        "type": "array",
        "items": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "segmentId",
            "marks"
          ],
          "properties": {
            "segmentId": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            },
            "marks": {
              "type": "array",
