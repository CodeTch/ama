        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "observation": {
        "$ref": "#/Observation"
      },
      "storedInspection": {
        "type": "string",
        "const": "AVAILABLE"
      },
      "sourceBytes": {
        "type": "array",
        "items": {
