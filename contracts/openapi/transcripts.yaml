    "required": [
      "meetingId",
      "observation",
      "storedInspection",
      "sourceBytes",
      "correction",
      "capabilities",
      "needsGeneration",
      "confirmation",
      "sources",
      "selected",
      "selectedConfirmation",
      "parserVersion",
      "processingConfigVersion",
      "confirmationHashProfile"
    ],
