{
  "RecordingSession": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "sessionId",
      "partId",
      "writerEpoch",
      "backendId"
    ],
    "properties": {
      "sessionId": {
        "type": "string",
        "format": "uuid"
      },
      "partId": {
        "type": "string",
        "format": "uuid"
      },
      "writerEpoch": {
        "type": "integer",
        "minimum": 1,
        "maximum": 9007199254740991
      },
      "backendId": {
        "type": "string",
        "pattern": "^[0-9a-f]{64}$"
      }
    }
  },
  "RecordingLease": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "sessionId",
      "partId",
      "writerEpoch",
      "backendId",
      "expiresAt"
    ],
    "properties": {
      "sessionId": {
        "type": "string",
        "format": "uuid"
      },
      "partId": {
        "type": "string",
        "format": "uuid"
      },
      "writerEpoch": {
        "type": "integer",
        "minimum": 1,
        "maximum": 9007199254740991
      },
      "backendId": {
        "type": "string",
        "pattern": "^[0-9a-f]{64}$"
      },
      "expiresAt": {
        "type": "string",
        "format": "date-time"
      }
    }
  },
  "RecordingAck": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "highestContiguousSeq",
      "missingSeqs"
    ],
    "properties": {
      "highestContiguousSeq": {
        "type": "integer",
        "minimum": 0,
        "maximum": 4096
      },
      "missingSeqs": {
        "type": "array",
        "maxItems": 512,
        "uniqueItems": true,
        "items": {
          "type": "integer",
          "minimum": 1,
          "maximum": 4096
        }
      }
    }
  },
  "RecordingFinish": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "sessionId",
      "finalSequence",
      "archiveTaskId"
    ],
    "properties": {
      "sessionId": {
        "type": "string",
        "format": "uuid"
      },
      "finalSequence": {
        "type": "integer",
        "minimum": 1,
        "maximum": 4096
      },
      "archiveTaskId": {
        "type": "string",
        "format": "uuid"
      }
    }
  },
  "RecordingArchive": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "taskId",
      "state",
      "available",
      "sampleCount"
    ],
    "properties": {
      "taskId": {
        "type": "string",
        "format": "uuid"
      },
      "state": {
        "type": "string",
        "enum": [
          "READY",
          "RUNNING",
          "RECONCILING",
          "SUCCEEDED",
          "FAILED",
          "CANCELLED",
          "STALE"
        ]
      },
      "available": {
        "type": "boolean"
      },
      "sampleCount": {
        "type": "integer",
        "minimum": 0,
        "maximum": 115200000
      }
    }
  },
  "RecordingError": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "error"
    ],
    "properties": {
      "error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "traceId"
        ],
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "RECORDING_CONFLICT",
              "RECORDING_GAP",
              "RECORDING_PAUSED",
              "RECORDING_UNAVAILABLE",
              "RECORDING_RATE_LIMITED",
              "RECORDING_READ_ONLY",
              "RECORDING_ARCHIVE_NOT_READY",
              "RECORDING_ARCHIVE_CONFLICT",
              "RECORDING_ARCHIVE_UNAVAILABLE",
              "INVALID_RANGE",
              "FORBIDDEN",
              "INVALID_ARGUMENT",
              "REQUEST_TOO_LARGE",
              "UNAUTHENTICATED"
            ]
          },
          "message": {
            "type": "string",
            "maxLength": 4096
          },
          "traceId": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
    }
  },
  "Error": {
    "description": "Current identity, meeting gate, recording fence or bounded transport rejected the request. No acknowledgement is implied.",
    "content": {
      "application/json": {
        "schema": {
          "$ref": "#/RecordingError"
        }
      }
    }
  },
