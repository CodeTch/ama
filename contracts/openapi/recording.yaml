  "RecordingSubtitleEvent": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "eventId",
      "sessionId",
      "partId",
      "segmentId",
      "revision",
      "status",
      "text",
      "startMs",
      "endMs",
      "sourceFinalSeq",
      "createdAt"
    ],
    "properties": {
      "eventId": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$"
      },
      "sessionId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "partId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "segmentId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "revision": {
        "type": "integer",
        "minimum": 1,
        "maximum": 3
      },
      "status": {
        "enum": [
          "temporary",
          "stable"
        ]
      },
      "text": {
        "type": "string",
        "maxLength": 8192
      },
      "startMs": {
        "type": "integer",
        "minimum": 0,
        "maximum": 7200000
      },
      "endMs": {
        "type": "integer",
        "minimum": 1,
        "maximum": 7200000
      },
      "sourceFinalSeq": {
        "type": "integer",
        "minimum": 1,
        "maximum": 4608
      },
      "createdAt": {
        "type": "string",
        "format": "date-time"
      }
    }
  },
  "RecordingSubtitles": {
    "type": "object",
    "additionalProperties": false,
