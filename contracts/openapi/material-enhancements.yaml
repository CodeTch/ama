  "EnhancementInput": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "expectedRevisionToken",
      "sourceRevisionId",
      "materialSnapshotId"
    ],
    "properties": {
      "expectedRevisionToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$"
      },
      "sourceRevisionId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "materialSnapshotId": {
        "anyOf": [
          {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          },
          {
            "type": "null"
          }
        ]
      }
    }
  },
