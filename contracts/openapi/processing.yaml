        "format": "uuid"
      },
      "purpose": {
        "type": "string"
      },
      "displayName": {
        "type": "string"
      },
      "state": {
        "type": "string",
        "enum": [
          "OPEN",
          "FINALIZING",
          "COMPLETED",
          "ABORTED",
          "FAILED"
        ]
      },
      "expectedSize": {
        "type": "integer",
        "format": "int64",
        "minimum": 0
      },
      "expectedSizeToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Opaque canonical decimal counter; preserve as a string. Revisions support 0..9223372036854775806."
      },
      "expectedSha256": {
        "type": [
