  "SavedSensitiveDirectory": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "id",
      "ordinalToken",
      "category",
      "locatorIds"
    ],
    "properties": {
      "id": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "ordinalToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Canonical decimal in 0..9223372036854775806. Never convert browser tokens to Number."
      },
      "category": {
        "enum": [
          "POLITICAL_SENSITIVE",
          "INTERNAL_BUSINESS_DATA"
        ]
      },
      "locatorIds": {
        "type": "array",
        "maxItems": 250000,
        "items": {
          "type": "string",
          "format": "uuid",
          "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        }
      }
    }
  },
  "SavedBackgroundDirectory": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "id",
      "ordinalToken",
      "body",
      "locatorIds"
    ],
    "properties": {
      "id": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      },
      "ordinalToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Canonical decimal in 0..9223372036854775806. Never convert browser tokens to Number."
      },
      "body": {
        "type": "string"
      },
      "locatorIds": {
        "type": "array",
        "maxItems": 250000,
        "items": {
          "type": "string",
          "format": "uuid",
          "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        }
      }
    }
  },
  "SavedCorrectionQualification": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "mode",
      "readiness",
      "qualificationId"
    ],
    "properties": {
      "mode": {
        "enum": [
          "DISABLED_NOT_INSTALLED",
          "UNAVAILABLE"
        ]
      },
      "readiness": {
        "enum": [
          "NOT_APPLICABLE",
          "UNAVAILABLE"
        ]
      },
      "qualificationId": {
        "oneOf": [
          {
            "type": "string"
          },
          {
            "type": "null"
          }
        ]
      }
    }
  }
