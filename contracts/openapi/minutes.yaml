            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          },
          {
            "type": "null"
          }
        ]
      },
      "currentMinutesRevisionId": {
        "oneOf": [
          {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          },
          {
            "type": "null"
          }
        ]
      }
    }
  },
