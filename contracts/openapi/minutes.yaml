  "MinutesObservation": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "revision",
      "revisionToken",
      "accessRevision",
      "accessRevisionToken",
      "currentConfirmationId",
      "currentMinutesRevisionId"
    ],
    "properties": {
      "revision": {
        "type": "integer",
        "format": "int64",
        "minimum": 0
      },
      "revisionToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
        "description": "Lossless decimal; preserve every digit. Revision values stop at 9223372036854775806."
      },
      "accessRevision": {
        "type": "integer",
        "format": "int64",
        "minimum": 0
      },
      "accessRevisionToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$",
