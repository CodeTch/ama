                    "required": [
                      "id",
                      "kind",
                      "input",
                      "input2",
                      "expected"
                    ],
                    "properties": {
                      "id": {
                        "type": "string"
                      },
                      "kind": {
                        "enum": [
                          "ASR",
                          "DIARIZATION",
                          "MINUTES",
                          "VOICE_SAME",
                          "VOICE_DIFFERENT",
                          "ENTITY",
                          "EVIDENCE"
                        ]
                      },
                      "input": {
                        "type": "string",
                        "maxLength": 1400000
                      },
