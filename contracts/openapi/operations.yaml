{
  "OperationsModelConfiguration": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "modelVersion",
      "promptVersion",
      "voiceThreshold"
    ],
    "properties": {
      "modelVersion": {
        "type": "string",
        "maxLength": 128
      },
      "promptVersion": {
        "type": "string",
        "maxLength": 128
      },
      "voiceThreshold": {
        "anyOf": [
          {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          },
          {
            "type": "null"
          }
        ]
      }
    }
  },
  "OperationsVoiceprint": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "id",
      "subjectId",
      "consentReference",
      "purpose",
      "modelVersion",
      "dimension",
      "sampleCount",
      "expiresAt",
      "state",
      "revisionToken",
      "reviewReason"
    ],
    "properties": {
      "id": {
        "type": "string",
        "format": "uuid"
      },
      "subjectId": {
        "type": "string"
      },
      "consentReference": {
        "type": "string",
        "maxLength": 1024
      },
      "purpose": {
        "const": "SPEAKER_CANDIDATE"
      },
      "modelVersion": {
        "type": "string"
      },
      "dimension": {
        "type": "integer",
        "minimum": 0
      },
      "sampleCount": {
        "type": "integer",
        "minimum": 0
      },
      "expiresAt": {
        "type": "string",
        "format": "date-time"
      },
      "state": {
        "enum": [
          "PENDING",
          "APPROVED",
          "REJECTED",
          "REVOKED"
        ]
      },
      "revisionToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$"
      },
      "reviewReason": {
        "anyOf": [
          {
            "type": "string"
          },
          {
            "type": "null"
          }
        ]
      }
    }
  },
  "OperationsVoiceprints": {
    "type": "array",
    "maxItems": 100,
    "items": {
      "$ref": "#/OperationsVoiceprint"
    }
  },
  "OperationsDataset": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "id",
      "version",
      "contentSha",
      "sampleCount"
    ],
    "properties": {
      "id": {
        "type": "string",
        "format": "uuid"
      },
      "version": {
        "type": "string"
      },
      "contentSha": {
        "type": "string",
        "pattern": "^[a-f0-9]{64}$"
      },
      "sampleCount": {
        "type": "integer",
        "minimum": 0
      }
    }
  },
  "OperationsDatasets": {
    "type": "array",
    "maxItems": 100,
    "items": {
      "$ref": "#/OperationsDataset"
    }
  },
  "OperationsEvaluationItem": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "id",
      "datasetVersion",
      "state",
      "reviewReason"
    ],
    "properties": {
      "id": {
        "type": "string",
        "format": "uuid"
      },
