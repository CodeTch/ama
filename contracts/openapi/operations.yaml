          "sampleCount",
          "succeeded",
          "failed",
          "pending",
          "score"
        ],
        "properties": {
          "sampleCount": {
            "type": "integer",
            "minimum": 0
          },
          "succeeded": {
            "type": "integer",
            "minimum": 0
          },
          "failed": {
            "type": "integer",
            "minimum": 0
          },
          "pending": {
            "type": "integer",
            "minimum": 0
          },
          "score": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          }
        }
      },
      "results": {
        "type": "array",
        "maxItems": 50,
        "items": {
          "$ref": "#/OperationsSampleResult"
        }
      }
    }
  },
  "OperationsConfiguration": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "revisionToken",
      "configuration",
      "history"
    ],
    "properties": {
      "revisionToken": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,18})$"
      },
      "configuration": {
        "$ref": "#/OperationsModelConfiguration"
      },
      "history": {
        "type": "array",
        "maxItems": 100,
        "items": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "revisionToken",
            "evaluationId",
            "rollbackOf",
            "reason",
            "createdAt"
          ],
          "properties": {
            "revisionToken": {
              "type": "string",
              "pattern": "^(0|[1-9][0-9]{0,18})$"
            },
            "evaluationId": {
              "anyOf": [
                {
                  "type": "string",
                  "format": "uuid"
                },
                {
                  "type": "null"
                }
              ]
            },
            "rollbackOf": {
              "anyOf": [
                {
                  "type": "string",
                  "pattern": "^(0|[1-9][0-9]{0,18})$"
                },
                {
                  "type": "null"
                }
              ]
            },
            "reason": {
              "type": "string",
              "maxLength": 2048
            },
            "createdAt": {
              "type": "string",
              "format": "date-time"
            }
          }
        }
      }
    }
  },
