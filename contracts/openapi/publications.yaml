      "officialDocumentUrl": {
        "oneOf": [
          {
            "type": "string",
            "pattern": "^/api/v1/meetings/[0-9a-f-]{36}/publications/[0-9a-f-]{36}/document$"
          },
          {
            "type": "null"
          }
        ],
        "description": "Exact same-origin document entry for a complete ACTIVE applied-success association. Each document request separately checks current application READ and provider DOCUMENT_READ; availability does not cache authorization."
      },
      "documentViewAvailability": {
        "enum": [
          "READY",
          "UNAVAILABLE"
        ]
      },
      "allowedActions": {
        "type": "array",
        "items": {
          "enum": [
            "VIEW_FROZEN",
            "REFRESH_STATUS",
            "VIEW_ATTEMPTS"
          ]
        },
        "maxItems": 16
      },
      "readOnlyReason": {
        "enum": [
          "PUBLICATION_MANUAL",
          "PUBLISHED",
          "PUBLICATION_FROZEN"
        ]
      },
      "eligibilityAvailability": {
        "const": "RECHECK_REQUIRED"
      },
      "publicationRevisionToken": {
        "$ref": "#/CounterToken"
      },
      "currentFinalId": {
        "oneOf": [
          {
            "$ref": "#/Uuid"
          },
          {
            "type": "null"
          }
        ]
      },
      "meetingRevisionToken": {
        "$ref": "#/CounterToken"
      },
      "currentTaskId": {
        "oneOf": [
          {
            "$ref": "#/Uuid"
          },
          {
            "type": "null"
          }
        ]
      },
      "executionId": {
        "oneOf": [
          {
            "$ref": "#/Uuid"
          },
          {
            "type": "null"
          }
        ]
      },
      "executionNoToken": {
        "oneOf": [
          {
            "$ref": "#/CounterToken"
          },
          {
            "type": "null"
          }
        ]
      },
      "operationId": {
        "oneOf": [
          {
            "$ref": "#/Uuid"
          },
          {
            "type": "null"
          }
        ]
      }
    },
    "required": [
      "publicationId",
      "confirmationId",
      "rawState",
      "remoteOutcome",
      "applicationOutcome",
      "manualLocked",
      "lookupPending",
      "officialDocumentUrl",
      "documentViewAvailability",
      "allowedActions",
      "readOnlyReason",
      "eligibilityAvailability"
    ],
    "description": "Fresh complete-history joined projection. Owner-only revision/current-final fields are absent for member. RemoteSUCCESS plus unapplied rawPENDING is terminal FENCED_MANUAL, lookupPending=false; no resend/reconciliation promise. B1 omits new-effect actions until full guarded eligibility is rechecked."
  },
