          "RECONCILING",
          "FAILED",
          "SUCCEEDED"
        ]
      },
      "remoteOutcome": {
        "enum": [
          "SUCCESS",
          "FAILED",
          "UNKNOWN",
          "NOT_OBSERVED"
        ]
      },
      "applicationOutcome": {
        "enum": [
          "APPLIED",
          "FENCED_MANUAL",
          "PENDING_LOOKUP",
          "PENDING"
        ]
      },
      "manualLocked": {
        "type": "boolean"
      },
      "lookupPending": {
        "type": "boolean"
