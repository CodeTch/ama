spring:
  application:
    name: ama-api
  main:
    banner-mode: 'off'
  flyway:
    enabled: false
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/ama?connectTimeout=1000&socketTimeout=1000}
    username: ${DATABASE_USERNAME:ama}
    password: ${DATABASE_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 1000
      validation-timeout: 500
      maximum-pool-size: 20
      minimum-idle: 0
      data-source-properties:
        characterEncoding: UTF-8
        connectionCollation: utf8mb4_0900_ai_ci
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: none
management:
  server:
    port: ${INTERNAL_PORT:8081}
    address: 127.0.0.1
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db,fileStorage
database:
  mode: ${DATABASE_MODE:private-ha}
storage:
  type: ${STORAGE_TYPE:local}
  default-backend-id: ${STORAGE_DEFAULT_BACKEND_ID:local-primary}
  s3:
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
internal:
  health:
    allowed-networks: ${INTERNAL_HEALTH_ALLOWED_NETWORKS:127.0.0.1/32,::1/128}
cas:
  # Both local and production deployments must set CAS_ENABLED=true and point
  # CAS_ORIGIN at the same company CAS provider. The safe default keeps
  # unconfigured test contexts from accepting an accidental login endpoint.
  enabled: ${CAS_ENABLED:false}
  origin: ${CAS_ORIGIN:}
  service-url: ${CAS_SERVICE_URL:}
  logout-service-url: ${CAS_LOGOUT_SERVICE_URL:}
  identity-attribute: ${CAS_IDENTITY_ATTRIBUTE:user}
  session-lifetime-seconds: ${CAS_SESSION_LIFETIME_SECONDS:28800}
