openapi: 3.1.0
info:
  title: AMA internal API foundation
  version: 0.1.0
  description: Runtime probes, shared enterprise sessions and revisioned meeting drafts. Real company sign-in, directory and category dictionary qualification remain prerequisites.
servers:
  - url: http://127.0.0.1:8081
    description: Loopback management listener; never publish through the public ingress.
paths:
  /internal/health/live:
    $ref: './health.yaml#/live'
  /internal/health/ready:
    $ref: './health.yaml#/ready'
  /api/v1/session:
    $ref: './identity.yaml#/session'
  /api/v1/session/logout:
    $ref: './identity.yaml#/logout'
  /api/v1/session/logout-all:
    $ref: './identity.yaml#/logoutAll'
  /api/v1/directory/people:
    $ref: './identity.yaml#/people'
  /api/v1/meetings:
    $ref: './meetings.yaml#/collection'
  /api/v1/meetings/{id}:
    $ref: './meetings.yaml#/item'
  /api/v1/meetings/{id}/info:
    $ref: './meetings.yaml#/info'
  /api/v1/meetings/{id}/roster-confirmations:
    $ref: './meetings.yaml#/confirmations'
  /api/v1/meetings/{id}/uploads:
    $ref: './files.yaml#/begin'
  /api/v1/uploads/{id}/parts/{part}:
    $ref: './files.yaml#/part'
  /api/v1/uploads/{id}/completion:
    $ref: './files.yaml#/completion'
  /api/v1/uploads/{id}:
    $ref: './files.yaml#/abort'
  /api/v1/files/{id}/content:
    $ref: './files.yaml#/content'
  /api/v1/meetings/{id}/processing-capabilities:
    $ref: './processing.yaml#/capabilities'
  /api/v1/meetings/{id}/transcript-imports:
    $ref: './processing.yaml#/imports'
  /api/v1/meetings/{id}/uploads/{upload}:
    $ref: './processing.yaml#/upload'
  /api/v1/meetings/{id}/uploads/{upload}/parts:
    $ref: './processing.yaml#/parts'
  /api/v1/meetings/{id}/completed-files:
    $ref: './processing.yaml#/files'
  /api/v1/meetings/{id}/processing-inputs:
    $ref: './processing.yaml#/inputs'
  /api/v1/meetings/{id}/processing-inputs/{input}:
    $ref: './processing.yaml#/input'
  /api/v1/meetings/{id}/processing-tasks:
    $ref: './processing.yaml#/tasks'
  /api/v1/meetings/{id}/processing-tasks/{task}:
    $ref: './processing.yaml#/task'
  /api/v1/meetings/{meetingId}/transcript:
    $ref: './transcripts.yaml#/current'
  /api/v1/meetings/{meetingId}/transcript/history:
    $ref: './transcripts.yaml#/history'
  /api/v1/meetings/{meetingId}/transcript/revisions/{revisionId}:
    $ref: './transcripts.yaml#/revision'
  /api/v1/meetings/{meetingId}/transcript/marks:
    $ref: './transcripts.yaml#/marks'
  /api/v1/meetings/{meetingId}/transcript/revisions/{revisionId}/marks:
    $ref: './transcripts.yaml#/revisionMarks'
  /api/v1/meetings/{meetingId}/transcript/confirmation:
    $ref: './transcripts.yaml#/confirmation'
  /api/v1/meetings/{meetingId}/transcript/confirmations:
    $ref: './transcripts.yaml#/confirmations'
  /api/v1/meetings/{meetingId}/transcript/confirmations/{confirmationId}:
    $ref: './transcripts.yaml#/confirmationItem'
  /api/v1/meetings/{meetingId}/transcript/restorations:
    $ref: './transcripts.yaml#/restorations'
  /api/v1/meetings/{meetingId}/transcript/sources/{fileId}:
    $ref: './transcripts.yaml#/source'
  /api/v1/meetings/{meetingId}/transcript/revisions/{revisionId}/sources/{fileId}:
    $ref: './transcripts.yaml#/revisionSource'
  /api/v1/meetings/{meetingId}/minutes/templates:
    $ref: './minutes.yaml#/templates'
  /api/v1/meetings/{meetingId}/minutes/initial-settings:
    $ref: './minutes.yaml#/initial'
  /api/v1/meetings/{meetingId}/minutes/generations:
    $ref: './minutes.yaml#/generate'
  /api/v1/meetings/{meetingId}/minutes/generation-inputs/current:
    $ref: './minutes.yaml#/current'
  /api/v1/meetings/{meetingId}/minutes/generation-inputs/{inputId}:
    $ref: './minutes.yaml#/input'
  /api/v1/meetings/{meetingId}/minutes/generation-tasks:
    $ref: './minutes.yaml#/tasks'
  /api/v1/meetings/{meetingId}/minutes/generation-tasks/{taskId}:
    $ref: './minutes.yaml#/task'
  /api/v1/meetings/{meetingId}/minutes/candidates:
    $ref: './minutes.yaml#/candidates'
  /api/v1/meetings/{meetingId}/minutes/candidates/{candidateId}:
    $ref: './minutes.yaml#/candidate'
components:
  securitySchemes:
    enterpriseSession:
      type: apiKey
      in: cookie
      name: __Host-AMA_SESSION
      description: Opaque server session; Secure, HttpOnly, Path=/, SameSite=Lax. No production sign-in or test-login route exists pending the company protocol.
