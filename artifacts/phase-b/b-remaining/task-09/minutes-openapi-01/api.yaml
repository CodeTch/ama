components:
  securitySchemes:
    enterpriseSession:
      type: apiKey
      in: cookie
      name: __Host-AMA_SESSION
      description: Opaque server session; Secure, HttpOnly, Path=/, SameSite=Lax. No production sign-in or test-login route exists pending the company protocol.
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
            - OUT_OF_SERVICE
            - UNKNOWN
    Actor:
      type: object
      additionalProperties: false
      required:
        - enterpriseId
        - status
        - roles
      properties:
        enterpriseId:
          type: string
          description: Exact company stable ID; case and trailing spaces are significant
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
        roles:
          type: array
          uniqueItems: true
          description: Platform privileges only; never a meeting body override
          items:
            type: string
            enum:
              - USER
              - PLATFORM_ADMIN
    Session:
      type: object
      additionalProperties: false
      required:
        - actor
        - csrfToken
        - expiresAt
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    BusinessError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - traceId
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - INVALID_ARGUMENT
                - IDENTITY_UNAVAILABLE
                - IDENTITY_PROVIDER_UNAVAILABLE
                - MEETING_FORBIDDEN
                - MEETING_CONFLICT
                - CATEGORY_DICTIONARY_UNAVAILABLE
                - REQUEST_TOO_LARGE
                - FILE_PURPOSE_UNAVAILABLE
                - FILE_CONFLICT
                - FILE_NOT_FOUND
                - FILE_STORAGE_UNAVAILABLE
                - FILE_INVALID_RANGE
            message:
              type: string
            traceId:
              type: string
              format: uuid
    Person:
      type: object
      additionalProperties: false
      required:
        - stableId
        - displayName
        - department
        - active
      properties:
        stableId:
          type: string
        displayName:
          type: string
        department:
          type:
            - string
            - 'null'
        active:
          type: boolean
    PeoplePage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        nextCursor:
          type:
            - string
            - 'null'
    ExpectedRevisionToken:
      type: string
      pattern: ^(0|[1-9][0-9]{0,18})$
      description: Opaque canonical decimal revision, 0..9223372036854775806. Preserve the string exactly. Dual representations must agree.
    Mutation:
      type: object
      required:
        - id
        - revision
        - revisionToken
      properties:
        id:
          type: string
          format: uuid
        revisionToken:
          $ref: '#/components/schemas/ExpectedRevisionToken'
        revision:
          type: integer
          format: int64
          minimum: 0
    Member:
      type: object
      required:
        - memberId
        - enterpriseId
        - displayName
        - memberKind
      properties:
        memberId:
          type: string
          format: uuid
        enterpriseId:
          type:
            - string
            - 'null'
        displayName:
          type: string
        memberKind:
          type: string
          enum:
            - ENTERPRISE
            - EXTERNAL
    Saved:
      allOf:
        - $ref: '#/components/schemas/Mutation'
        - type: object
          required:
            - accessRevision
            - accessRevisionToken
            - stage
            - name
            - category
            - summary
            - occurredOn
            - confirmedRosterId
            - confirmedRoster
            - rosterDraftId
            - rosterDraft
          properties:
            accessRevisionToken:
              $ref: '#/components/schemas/ExpectedRevisionToken'
            accessRevision:
              type: integer
              format: int64
            stage:
              type: string
              enum:
                - ENTRY
                - TRANSCRIPT_PENDING
                - TRANSCRIPT_FAILED
                - MINUTES_PENDING
                - MINUTES_FAILED
                - READY_TO_PUBLISH
                - PUBLISH_FAILED
                - PUBLISHED
            name:
              type:
                - string
                - 'null'
            category:
              type:
                - string
                - 'null'
            summary:
              type:
                - string
                - 'null'
            occurredOn:
              type:
                - string
                - 'null'
              format: date
            confirmedRosterId:
              type:
                - string
                - 'null'
              format: uuid
            confirmedRoster:
              type: array
              items:
                $ref: '#/components/schemas/Member'
            rosterDraftId:
              type:
                - string
                - 'null'
              format: uuid
            rosterDraft:
              type:
                - array
                - 'null'
              items:
                $ref: '#/components/schemas/Member'
    ExpectedRevision:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854776000
    SaveInfo:
      type: object
      additionalProperties: false
      required:
        - rosterDraftIds
      anyOf:
        - required:
            - expectedRevision
        - required:
            - expectedRevisionToken
      properties:
        expectedRevision:
          $ref: '#/components/schemas/ExpectedRevision'
        expectedRevisionToken:
          $ref: '#/components/schemas/ExpectedRevisionToken'
        name:
          type:
            - string
            - 'null'
        category:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 255
        summary:
          type:
            - string
            - 'null'
        occurredOn:
          type:
            - string
            - 'null'
          format: date
        rosterDraftIds:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 255
        externalRosterNames:
          type:
            - array
            - 'null'
          items:
            type: string
            minLength: 1
    UploadSummary:
      type: object
      additionalProperties: false
      required:
        - uploadId
        - purpose
        - displayName
        - state
        - expectedSize
        - expectedSizeToken
        - expectedSha256
        - createdAt
        - updatedAt
        - completedFileId
      properties:
        uploadId:
          type: string
          format: uuid
        purpose:
          type: string
        displayName:
          type: string
        state:
          type: string
          enum:
            - OPEN
            - FINALIZING
            - COMPLETED
            - ABORTED
            - FAILED
        expectedSize:
          type: integer
          format: int64
          minimum: 0
        expectedSizeToken:
          type: string
          pattern: ^(0|[1-9][0-9]{0,18})$
          description: Opaque canonical decimal counter; preserve as a string. Revisions support 0..9223372036854775806.
        expectedSha256:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedFileId:
          type:
            - string
            - 'null'
          format: uuid
    UploadSummaryPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UploadSummary'
        nextCursor:
          type:
            - string
            - 'null'
    Hash:
      type: string
      pattern: ^[0-9a-fA-F]{64}$
    Begin:
      type: object
      additionalProperties: false
      required:
        - purpose
        - name
        - size
      properties:
        purpose:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        name:
          type: string
          description: Exact stored/display value; never an object key or path. No product character quota. The HTTP download filename has a separate bounded transport representation.
        size:
          type: integer
          format: int64
          minimum: 0
        sha256:
          oneOf:
            - $ref: '#/components/schemas/Hash'
            - type: 'null'
    Accepted:
      type: object
      additionalProperties: false
      required:
        - uploadId
        - partSize
        - partSizeToken
      properties:
        uploadId:
          type: string
          format: uuid
        partSize:
          type: integer
          format: int64
          minimum: 1
          description: Technical suggestion only; restart never re-slices accepted receipts.
        partSizeToken:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Opaque canonical decimal representation of the unchanged positive partSize value, 1..9223372036854775807. Preserve this string exactly.
    Completion:
      type: object
      additionalProperties: false
      required:
        - parts
        - sha256
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - part
              - sha256
            properties:
              part:
                type: integer
                minimum: 1
                maximum: 2147483647
              sha256:
                $ref: '#/components/schemas/Hash'
        sha256:
          $ref: '#/components/schemas/Hash'
    Completed:
      type: object
      additionalProperties: false
      required:
        - fileId
      properties:
        fileId:
          type: string
          format: uuid
    Capabilities:
      type: object
      additionalProperties: false
      required:
        - revision
        - revisionToken
        - accessRevision
        - accessRevisionToken
        - canSubmit
        - readOnlyReason
        - intake
        - execution
        - businessReady
        - formats
        - purpose
        - materialMode
        - budgets
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        revisionToken:
          type: string
          pattern: ^(0|[1-9][0-9]{0,18})$
          description: Opaque canonical decimal counter; preserve as a string. Revisions support 0..9223372036854775806.
        accessRevision:
          type: integer
          format: int64
          minimum: 0
        accessRevisionToken:
          type: string
          pattern: ^(0|[1-9][0-9]{0,18})$
          description: Opaque canonical decimal counter; preserve as a string. Revisions support 0..9223372036854775806.
        canSubmit:
          type: boolean
        readOnlyReason:
          type:
            - string
            - 'null'
        intake:
          type: string
          enum:
            - AVAILABLE
            - UNAVAILABLE
        execution:
          type: string
          enum:
            - INSTALLED
            - NOT_INSTALLED
            - UNAVAILABLE
        businessReady:
          type: boolean
        formats:
          type: array
          items:
            type: string
            enum:
              - TXT
        purpose:
          type: string
          enum:
            - TRANSCRIPT_INPUT
        materialMode:
          type: string
          enum:
            - EMPTY
        budgets:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
                format: int64
                minimum: 0
    ImportRequest:
      type: object
      additionalProperties: false
      required:
        - orderedFileIds
      properties:
        expectedRevision:
          $ref: '#/components/schemas/ExpectedRevision'
