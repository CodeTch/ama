openapi: 3.1.0
info:
  title: AMA internal API foundation
  version: 0.1.0
  description: Runtime probes, shared enterprise sessions and revisioned meeting drafts. Real company sign-in, directory and category dictionary qualification remain prerequisites.
servers:
  - url: http://127.0.0.1:8081
    description: Loopback management listener; never publish through the public ingress.
paths:
  /internal/health/live:
    get:
      operationId: internalLiveness
      summary: Process liveness independent of database availability
      description: Accessible only on the management listener from explicitly allowed source networks. Forwarded headers do not grant access.
      responses:
        '200':
          description: Process is alive
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Process is stopping or broken
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
  /internal/health/ready:
    get:
      operationId: internalReadiness
      summary: Admission readiness requires a real database connection
      description: A missing or failed MySQL dependency returns 503 while liveness remains independent. Internal access uses the management listener and source network policy.
      responses:
        '200':
          description: Application accepts traffic and JDBC dependency is healthy
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Database unavailable or application refusing traffic
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/session:
    servers:
      - url: http://127.0.0.1:8080
        description: Public API listener behind the deployment TLS ingress
    get:
      operationId: currentSession
      summary: Resolve current shared database session
      description: Rechecks ACTIVE identity, generation, expiration and revocation on each request. Response is not cached; raw session token is never returned.
      security:
        - enterpriseSession: []
      responses:
        '200':
          description: Authenticated identity and session-bound CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/session/logout:
    servers:
      - url: http://127.0.0.1:8080
    post:
      operationId: logoutSession
      summary: Revoke the current server session on both nodes
      security:
        - enterpriseSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Session revoked; secure host-only cookie expired
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/session/logout-all:
    servers:
      - url: http://127.0.0.1:8080
    post:
      operationId: logoutAllSessions
      summary: Advance the authenticated identity generation to revoke all its sessions
      description: Identity comes exclusively from the authenticated server session. Browser identity or role claims are never accepted.
      security:
        - enterpriseSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: All sessions for this identity revoked; cookie expired
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/directory/people:
    servers:
      - url: http://127.0.0.1:8080
    get:
      operationId: searchDirectoryPeople
      summary: Search enterprise people by stable identity
      description: Company directory protocol is pending, so production returns a safe 503. Controlled test projections keep same-name people distinct by stable ID and department. This does not create an account or meeting authorization.
      security:
        - enterpriseSession: []
      parameters:
        - name: query
          in: query
          schema:
            type: string
            default: ''
        - name: cursor
          in: query
          description: Opaque next-page cursor from the prior response
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of directory entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeoplePage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/meetings:
    servers:
      - url: http://127.0.0.1:8080
    post:
      operationId: createMeeting
      summary: Create an empty meeting owned by the current active identity
      description: No name, category, date or roster is required. The actual meeting date remains null. Same-key replay returns the original ID, revision and ENTRY stage after current authorization is checked.
      security:
        - enterpriseSession: []
      parameters:
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '201':
          description: Original created draft, including on replay
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Mutation'
                  - type: object
                    required:
                      - stage
                    properties:
                      stage:
                        type: string
                        const: ENTRY
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/MeetingUnavailable'
  /api/v1/meetings/{id}:
    servers:
      - url: http://127.0.0.1:8080
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getSavedMeeting
      summary: Read currently valid saved meeting information
      description: Rechecks shared ACTIVE identity and owner or current confirmed enterprise membership. Members receive only saved information and the current confirmed roster; rosterDraft and rosterDraftId are null. Only the owner receives a pending saved roster draft. No candidates, AI guesses or unsaved client values are returned. All responses are no-store. This is not a list or search endpoint.
      security:
        - enterpriseSession: []
      responses:
        '200':
          description: Authorized saved projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saved'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '503':
          $ref: '#/components/responses/MeetingUnavailable'
  /api/v1/meetings/{id}/info:
    servers:
      - url: http://127.0.0.1:8080
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: saveMeetingInfo
      summary: Save human information and a separate pending roster using revision CAS
      description: Owner only. Fields are a complete saved value; omitted optional text/date become null. rosterDraftIds contains exact stable enterprise IDs, without case/whitespace normalization. externalRosterNames are display-only people and never grant access. A changed roster creates a draft without changing current grants or confirmed search names. Name and summary have no product character limit; the configurable transport budget rejects oversized bodies without truncation. Non-null category requires an approved dictionary; production remains unavailable until that company/config port is qualified. Published or governed meetings cannot be edited.
      security:
        - enterpriseSession: []
      parameters:
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveInfo'
      responses:
        '200':
          description: Original accepted meeting ID and revision, including on replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mutation'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/MeetingUnavailable'
  /api/v1/meetings/{id}/roster-confirmations:
    servers:
      - url: http://127.0.0.1:8080
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: confirmMeetingRoster
      summary: Explicitly confirm the latest saved roster draft
      description: Owner only, independent of missing name/category/date. CAS pins the current saved draft; no client roster or candidate is accepted. Creates an immutable confirmed version, checks exact ACTIVE enterprise identities, replaces effective READ grants and current name projection atomically. Empty roster is legal. Prior confirmed access remains in effect until this request commits. A historical replay returns its original revision and never reactivates its old grants.
      security:
        - enterpriseSession: []
      parameters:
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf:
                - required:
                    - expectedRevision
                - required:
                    - expectedRevisionToken
              properties:
                expectedRevision:
                  $ref: '#/components/schemas/ExpectedRevision'
                expectedRevisionToken:
                  $ref: '#/components/schemas/ExpectedRevisionToken'
      responses:
        '200':
          description: Original accepted meeting ID and revision, including on replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mutation'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/MeetingUnavailable'
  /api/v1/meetings/{id}/uploads:
    servers:
      - url: http://127.0.0.1:8080
    post:
      operationId: beginFileUpload
      summary: Accept a pinned upload after durable storage begin and database commit
      security:
        - enterpriseSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Key'
      responses:
        '201':
          description: Committed result after current authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '409':
          $ref: '#/components/responses/Conflict-2'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/Unavailable-2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Begin'
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listMeetingUploads
      security:
        - enterpriseSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      description: ''
      responses:
        '200':
          description: Fresh authorized persisted result; private, no-store.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSummaryPage'
        '400':
          description: 'INVALID_ARGUMENT: invalid wire/query/cursor or unequal dual revision values.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '401':
          description: 'UNAUTHENTICATED: missing or revoked current session.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '403':
          description: 'MEETING_FORBIDDEN: current owner required; capabilities permit current READ members with denied mutation capabilities.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '404':
          description: 'PROCESSING_NOT_FOUND: absent or wrong-meeting item after authorization.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '409':
          description: PROCESSING_CONFLICT or REVISION_EXHAUSTED; retain key and original body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '413':
          description: 'REQUEST_TOO_LARGE: finite protocol/operational admission bound exceeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: 'PROCESSING_INPUT_INVALID: unsupported domain input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '503':
          description: PROCESSING_UNAVAILABLE, PROFILE_UNAVAILABLE or PROCESSING_READ_BUDGET_EXCEEDED; no partial or speculative acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
  /api/v1/uploads/{id}/parts/{part}:
    servers:
      - url: http://127.0.0.1:8080
    put:
      operationId: writeFileUploadPart
      summary: Accept immutable verified bytes and commit a server-owned receipt
      security:
        - enterpriseSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
        - name: part
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: X-Checksum-SHA256
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/Hash'
        - name: Content-Length
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '204':
          description: Verified durable part receipt committed; same content replays
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '409':
          $ref: '#/components/responses/Conflict-2'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/Unavailable-2'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
    parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/uploads/{id}/completion:
    servers:
      - url: http://127.0.0.1:8080
    post:
      operationId: completeFileUpload
      summary: Freeze every committed receipt then durably publish and atomically register one file
      security:
        - enterpriseSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Committed result after current authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completed'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '409':
          $ref: '#/components/responses/Conflict-2'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/Unavailable-2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Completion'
    parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/uploads/{id}:
    servers:
      - url: http://127.0.0.1:8080
    delete:
      operationId: abortFileUpload
      summary: Abort only OPEN uploads; FINALIZING conflicts and completed files are preserved
      security:
        - enterpriseSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Committed abort or authorized unchanged terminal replay
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '409':
          $ref: '#/components/responses/Conflict-2'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/Unavailable-2'
    parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/files/{id}/content:
    servers:
      - url: http://127.0.0.1:8080
    get:
      operationId: downloadBusinessFile
      summary: Read only through fresh meeting authorization and a registered current business reference
      security:
        - enterpriseSession: []
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: One bytes range, including open-ended or suffix ranges; multiple ranges are rejected.
      responses:
        '200':
          description: Complete authorized content
          headers:
            Content-Disposition:
              schema:
                type: string
              description: At most 1024 ASCII bytes for the whole value. Safe ASCII fallback download plus the complete RFC5987 UTF-8 name when it fits; otherwise a Unicode-scalar-safe transport prefix ending in ... . Full stored/display name is unchanged.
            Accept-Ranges:
              schema:
                type: string
                const: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Exactly the selected single byte range; the same bounded Content-Disposition filename policy applies as for complete content.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BusinessForbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '409':
          $ref: '#/components/responses/Conflict-2'
        '413':
          $ref: '#/components/responses/TooLarge'
        '416':
          $ref: '#/components/responses/Range'
        '503':
          $ref: '#/components/responses/Unavailable-2'
      description: UPLOAD_SESSION is technical durability protection and never a business read grant. Unknown reference kinds and unavailable production domain policies are unreadable. Backend keys, provider tokens and physical locations never appear in responses. Pre-open authorization is implemented; D06 owns periodic in-stream revocation.
    parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/meetings/{id}/processing-capabilities:
    servers:
      - url: http://127.0.0.1:8080
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getProcessingCapabilities
      security:
        - enterpriseSession: []
      parameters: []
      description: READ-authorized safe availability. Execution remains NOT_INSTALLED until a real worker is installed; queue existence does not imply execution health. Only the current owner can submit.
      responses:
        '200':
          description: Fresh authorized persisted result; private, no-store.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '400':
          description: 'INVALID_ARGUMENT: invalid wire/query/cursor or unequal dual revision values.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '401':
          description: 'UNAUTHENTICATED: missing or revoked current session.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '403':
          description: 'MEETING_FORBIDDEN: current owner required; capabilities permit current READ members with denied mutation capabilities.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '404':
          description: 'PROCESSING_NOT_FOUND: absent or wrong-meeting item after authorization.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '409':
          description: PROCESSING_CONFLICT or REVISION_EXHAUSTED; retain key and original body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '413':
          description: 'REQUEST_TOO_LARGE: finite protocol/operational admission bound exceeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: 'PROCESSING_INPUT_INVALID: unsupported domain input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '503':
          description: PROCESSING_UNAVAILABLE, PROFILE_UNAVAILABLE or PROCESSING_READ_BUDGET_EXCEEDED; no partial or speculative acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
  /api/v1/meetings/{id}/transcript-imports:
    servers:
      - url: http://127.0.0.1:8080
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: acceptTranscriptImport
      security:
        - enterpriseSession: []
      parameters:
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      description: Mandatory fresh DB-only accepted-result lookup precedes current CAS/exhaustion/source/archive/readiness checks. Same normalized key/body returns the original committed task/input/batch/revision, including with new intake unavailable; different payload conflicts. Exactly one bounded fresh lookup after named ordinary preparation failure can discover a concurrent committed winner. Final claim serialization repeats authorized replay first. Actual acceptance is input+READY task, with no RAW output. Never automatically rekey or infer success from client memory.
      responses:
        '202':
          description: Fresh authorized persisted result; private, no-store.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            Location:
              schema:
                type: string
              description: Actual persisted processing-input detail route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAccepted'
        '400':
          description: 'INVALID_ARGUMENT: invalid wire/query/cursor or unequal dual revision values.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '401':
          description: 'UNAUTHENTICATED: missing or revoked current session.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '403':
          description: 'MEETING_FORBIDDEN: current owner required; capabilities permit current READ members with denied mutation capabilities.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '404':
          description: 'PROCESSING_NOT_FOUND: absent or wrong-meeting item after authorization.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '409':
          description: PROCESSING_CONFLICT or REVISION_EXHAUSTED; retain key and original body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '413':
          description: 'REQUEST_TOO_LARGE: finite protocol/operational admission bound exceeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: 'PROCESSING_INPUT_INVALID: unsupported domain input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '503':
          description: PROCESSING_UNAVAILABLE, PROFILE_UNAVAILABLE or PROCESSING_READ_BUDGET_EXCEEDED; no partial or speculative acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
  /api/v1/meetings/{id}/uploads/{upload}:
    servers:
