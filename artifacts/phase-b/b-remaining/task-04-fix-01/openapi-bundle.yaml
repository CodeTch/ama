  responses:
    Forbidden:
      description: Source network or listener is not authorized
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - error
            properties:
              error:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    const: FORBIDDEN
                  message:
                    type: string
                    const: Access denied
    Unauthenticated:
      description: Session absent, expired, revoked, disabled or from an old generation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
    BusinessForbidden:
      description: Denied meeting access, wrong listener or failed Origin/CSRF policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
    Unavailable:
      description: Identity database or unqualified company provider unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
    Invalid:
      description: Invalid directory page request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
    Conflict:
      description: REVISION_EXHAUSTED after authorized replay, same key with different payload, stale expectedRevision, no pending draft, inactive/unknown roster identity, or immutable published state. No partial effects; retain client input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
    TooLarge:
      description: Body exceeds meeting.http.max-request-bytes (default 8388608 bytes). Configurable transport budget, not a product name or summary limit; no truncation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
    MeetingUnavailable:
      description: Shared database or approved category dictionary unavailable; no fabricated enterprise options.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
    Missing:
      description: No available authorized business file or upload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
    Conflict-2:
      description: Different request, frozen or terminated session, publication or cancellation fence
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
    Unavailable-2:
      description: Unconfigured or disabled purpose/storage, or unknown transaction acknowledgment; retry the same request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
    Range:
      description: Requested single range is invalid or unsatisfiable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match the configured allowed origin
      schema:
        type: string
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: Independent session-bound token returned by currentSession
      schema:
        type: string
    Key:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Exactly one nonblank opaque key. Scope is the length-prefixed actor/resource/operation/key SHA-256. Full semantic payload digest must match; conflicting reuse returns 409. Rolled-back attempts do not consume the key. No history TTL.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Canonical lowercase full UUID, also the meeting number; knowing it grants no access.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    After:
      name: after
      in: query
      schema:
        type: string
        format: uuid
      description: Strict greater-than UUID keyset cursor. Refresh from first page after changes; this is not a snapshot.
    uploadId:
      name: upload
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    AfterPart:
      name: afterPart
      in: query
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]{0,18})$
        description: Opaque canonical decimal counter; preserve as a string. Revisions support 0..9223372036854775806.
    inputId:
      name: input
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      schema:
        type: string
        enum:
          - active
          - all
        default: active
    taskId:
      name: task
      in: path
      required: true
      schema:
        type: string
        format: uuid
